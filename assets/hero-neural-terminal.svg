<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030508"/>
      <stop offset="55%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0A0816"/>
    </linearGradient>

    <linearGradient id="neonText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="edgeCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.38"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.78" cy="0.45" r="0.36">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.20" cy="0.82" r="0.42">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="268" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.05s steps(2, start) infinite; }
    .pulse-slow { animation: pulseNode 3.2s ease-in-out infinite; }
    .pulse-fast { animation: pulseNode 2.2s ease-in-out infinite; }
    .pulse-mid  { animation: pulseNode 2.7s ease-in-out infinite; }
    .scanline   { animation: scan 5.8s linear infinite; }
    .status-dot { animation: statusBlink 1.8s ease-in-out infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes scan {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(290px); }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="900" height="270" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#grid)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#glowCyan)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#glowViolet)"/>

    <!-- Scanline -->
    <rect class="scanline" x="0" y="0" width="900" height="36" fill="url(#scanGrad)"/>

    <!-- Console Top Chrome -->
    <rect x="0" y="0" width="900" height="34" fill="#080C14" fill-opacity="0.95"/>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="21" class="mono" font-size="11.5" letter-spacing="1.5" fill="#00F5D4">┌──[</text>
    <text x="58" y="21" class="mono" font-size="11" letter-spacing="1.2" fill="#94A3B8">VERONIKA@NEURO-AI :: CONSOLE_V2.6</text>
    <text x="342" y="21" class="mono" font-size="11.5" letter-spacing="1.5" fill="#00F5D4">]</text>
    <text x="720" y="21" class="mono" font-size="11" letter-spacing="1.5" fill="#00F5D4">● SYS_ONLINE // 2026</text>

    <!-- Corner Cyberpunk Brackets -->
    <path d="M 14 48 L 14 62 M 14 48 L 28 48" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M 886 256 L 886 242 M 886 256 L 872 256" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Animated Neural Connectome (Right Side) -->
    <g id="neural-net" transform="translate(565, 48)">
      <path d="M 45 145 L 120 75 L 215 95 L 285 45" stroke="url(#edgeCyan)" stroke-width="1.4" fill="none" stroke-opacity="0.65"/>
      <path d="M 25 70 L 120 75 L 175 160 L 270 140" stroke="url(#edgeCyan)" stroke-width="1.4" fill="none" stroke-opacity="0.55"/>
      <path d="M 45 145 L 175 160 L 215 95 L 270 140" stroke="#A855F7" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
      <path d="M 85 25 L 120 75 L 190 30 L 285 45" stroke="#38BDF8" stroke-width="1.2" fill="none" stroke-opacity="0.5"/>
      <path d="M 25 70 L 85 25 L 190 30 L 215 95" stroke="#00F5D4" stroke-width="1" fill="none" stroke-opacity="0.35"/>
      <path d="M 95 185 L 175 160 L 250 185 L 270 140" stroke="#A855F7" stroke-width="1" fill="none" stroke-opacity="0.35"/>

      <!-- Traveling Action Potentials -->
      <circle r="3.2" fill="#00F5D4" filter="url(#glow)">
        <animateMotion dur="3.6s" repeatCount="indefinite" path="M 45 145 L 120 75 L 215 95 L 285 45"/>
      </circle>
      <circle r="2.8" fill="#A855F7" filter="url(#glow)">
        <animateMotion dur="4.2s" begin="0.8s" repeatCount="indefinite" path="M 25 70 L 120 75 L 175 160 L 270 140"/>
      </circle>
      <circle r="2.5" fill="#38BDF8" filter="url(#glow)">
        <animateMotion dur="3.1s" begin="1.5s" repeatCount="indefinite" path="M 85 25 L 120 75 L 190 30 L 285 45"/>
      </circle>
      <circle r="2.6" fill="#00F5D4" filter="url(#glow)">
        <animateMotion dur="4.8s" begin="0.3s" repeatCount="indefinite" path="M 270 140 L 215 95 L 175 160 L 45 145"/>
      </circle>

      <!-- Nodes -->
      <circle cx="120" cy="75" r="7" fill="#030508" stroke="#00F5D4" stroke-width="2" filter="url(#glow)" class="pulse-fast"/>
      <circle cx="215" cy="95" r="6.5" fill="#030508" stroke="#A855F7" stroke-width="2" filter="url(#glow)" class="pulse-slow"/>
      <circle cx="175" cy="160" r="5.5" fill="#030508" stroke="#38BDF8" stroke-width="1.8" class="pulse-mid"/>
      <circle cx="45" cy="145" r="4.5" fill="#030508" stroke="#00F5D4" stroke-width="1.6" class="pulse-slow"/>
      <circle cx="285" cy="45" r="5" fill="#030508" stroke="#00F5D4" stroke-width="1.8" filter="url(#glow)" class="pulse-fast"/>
      <circle cx="25" cy="70" r="4" fill="#030508" stroke="#A855F7" stroke-width="1.5" class="pulse-mid"/>
      <circle cx="85" cy="25" r="4" fill="#030508" stroke="#38BDF8" stroke-width="1.5" class="pulse-slow"/>
      <circle cx="190" cy="30" r="4.5" fill="#030508" stroke="#00F5D4" stroke-width="1.5" class="pulse-mid"/>
      <circle cx="270" cy="140" r="5" fill="#030508" stroke="#A855F7" stroke-width="1.8" class="pulse-fast"/>
      <circle cx="95" cy="185" r="3.5" fill="#030508" stroke="#38BDF8" stroke-width="1.3"/>
      <circle cx="250" cy="185" r="3.5" fill="#030508" stroke="#A855F7" stroke-width="1.3"/>

      <text x="132" y="69" class="mono" font-size="9.5" letter-spacing="1" fill="#00F5D4" fill-opacity="0.85">RAG_CORE</text>
      <text x="226" y="92" class="mono" font-size="9.5" letter-spacing="1" fill="#C084FC" fill-opacity="0.9">PM_STRAT</text>
      <text x="184" y="176" class="mono" font-size="9.5" letter-spacing="1" fill="#38BDF8" fill-opacity="0.85">NEURO_AI</text>
    </g>

    <!-- Left Cyberpunk Console Typography Block -->
    <g transform="translate(36, 68)">
      <text x="0" y="12" class="mono" font-size="12" letter-spacing="1.8" fill="#00F5D4">&gt;&gt; INIT_IDENTITY --MODE=CYBER_CONSOLE</text>

      <!-- Wide-Tracked Futuristic Monospace ALL-CAPS Title -->
      <text x="0" y="62" class="mono" font-size="40" font-weight="700" letter-spacing="9" fill="url(#neonText)" filter="url(#glow)">VERONIKA</text>
      <line x1="0" y1="74" x2="368" y2="74" stroke="url(#neonText)" stroke-width="1.2" stroke-opacity="0.5"/>

      <!-- Console Role Subtitle -->
      <text x="0" y="100" class="mono" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#F1F5F9">
        TECHNICAL &amp; AI PRODUCT / PROGRAM MANAGER<tspan class="cursor" fill="#00F5D4">█</tspan>
      </text>

      <!-- Subline in crisp monospace -->
      <text x="0" y="124" class="mono" font-size="11.5" letter-spacing="0.8" fill="#94A3B8">
        // AGENTIC AI · HEALTHCARE TECH · CROSS-FUNCTIONAL DELIVERY
      </text>

      <!-- Console Status Boxes -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="242" height="28" rx="4" fill="#090E18" stroke="#00F5D4" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="15" cy="14" r="3.5" fill="#00F5D4" class="status-dot"/>
        <text x="27" y="18" class="mono" font-size="11" letter-spacing="1.1" fill="#E2E8F0">M.SC. NEUROSCIENCE (1.1)</text>

        <rect x="254" y="0" width="194" height="28" rx="4" fill="#090E18" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="268" y="18" class="mono" font-size="11" letter-spacing="1.2" fill="#D8B4FE">BERLIN → FREIBURG</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="268" rx="10" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="268" rx="10" stroke="url(#neonText)" stroke-opacity="0.32" stroke-width="1"/>
</svg>
