<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pitch black background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="55%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0B0917"/>
    </linearGradient>

    <!-- Cyan to Violet neon accent -->
    <linearGradient id="neonText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="edgeCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Ambient radial glows -->
    <radialGradient id="glowCyan" cx="0.78" cy="0.45" r="0.35">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.22" cy="0.85" r="0.4">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft neon glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>

    <!-- Scanline gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="268" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    .pulse-slow { animation: pulseNode 3.2s ease-in-out infinite; }
    .pulse-fast { animation: pulseNode 2.2s ease-in-out infinite; }
    .pulse-mid  { animation: pulseNode 2.7s ease-in-out infinite; }
    .scanline   { animation: scan 6s linear infinite; }
    .status-dot { animation: statusBlink 2s ease-in-out infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes scan {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(290px); }
    }
  </style>

  <!-- Card Container -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="900" height="270" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#grid)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#glowCyan)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#glowViolet)"/>

    <!-- Animated subtle scanline -->
    <rect class="scanline" x="0" y="0" width="900" height="36" fill="url(#scanGrad)"/>

    <!-- Terminal Top Bar -->
    <rect x="0" y="0" width="900" height="34" fill="#0A0E17" fill-opacity="0.9"/>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#1E293B" stroke-width="1"/>
    <circle cx="22" cy="17" r="5" fill="#FF5F56" fill-opacity="0.85"/>
    <circle cx="40" cy="17" r="5" fill="#FFBD2E" fill-opacity="0.85"/>
    <circle cx="58" cy="17" r="5" fill="#27C93F" fill-opacity="0.85"/>
    <text x="82" y="21" class="mono" font-size="11.5" fill="#64748B">veronika@neuro-ai:~  —  zsh  —  80×24</text>
    <text x="765" y="21" class="mono" font-size="11" fill="#00F5D4" fill-opacity="0.85">SYS: ONLINE</text>

    <!-- Animated Neural Connectome (Right Side) -->
    <g id="neural-net" transform="translate(560, 48)">
      <!-- Synaptic Edges -->
      <path id="e1" d="M 45 145 L 120 75 L 215 95 L 285 45" stroke="url(#edgeCyan)" stroke-width="1.4" fill="none" stroke-opacity="0.65"/>
      <path id="e2" d="M 25 70 L 120 75 L 175 160 L 270 140" stroke="url(#edgeCyan)" stroke-width="1.4" fill="none" stroke-opacity="0.55"/>
      <path id="e3" d="M 45 145 L 175 160 L 215 95 L 270 140" stroke="#A855F7" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
      <path id="e4" d="M 85 25 L 120 75 L 190 30 L 285 45" stroke="#38BDF8" stroke-width="1.2" fill="none" stroke-opacity="0.5"/>
      <path id="e5" d="M 25 70 L 85 25 L 190 30 L 215 95" stroke="#00F5D4" stroke-width="1" fill="none" stroke-opacity="0.35"/>
      <path id="e6" d="M 95 185 L 175 160 L 250 185 L 270 140" stroke="#A855F7" stroke-width="1" fill="none" stroke-opacity="0.35"/>

      <!-- Animated Traveling Action Potentials (Data Pulses) -->
      <circle r="3.2" fill="#00F5D4" filter="url(#glow)">
        <animateMotion dur="3.6s" repeatCount="indefinite" path="M 45 145 L 120 75 L 215 95 L 285 45"/>
      </circle>
      <circle r="2.8" fill="#A855F7" filter="url(#glow)">
        <animateMotion dur="4.2s" begin="0.8s" repeatCount="indefinite" path="M 25 70 L 120 75 L 175 160 L 270 140"/>
      </circle>
      <circle r="2.5" fill="#38BDF8" filter="url(#glow)">
        <animateMotion dur="3.1s" begin="1.5s" repeatCount="indefinite" path="M 85 25 L 120 75 L 190 30 L 285 45"/>
      </circle>
      <circle r="2.6" fill="#00F5D4" filter="url(#glow)">
        <animateMotion dur="4.8s" begin="0.3s" repeatCount="indefinite" path="M 270 140 L 215 95 L 175 160 L 45 145"/>
      </circle>

      <!-- Neural Nodes -->
      <circle cx="120" cy="75" r="7" fill="#05070B" stroke="#00F5D4" stroke-width="2" filter="url(#glow)" class="pulse-fast"/>
      <circle cx="215" cy="95" r="6.5" fill="#05070B" stroke="#A855F7" stroke-width="2" filter="url(#glow)" class="pulse-slow"/>
      <circle cx="175" cy="160" r="5.5" fill="#05070B" stroke="#38BDF8" stroke-width="1.8" class="pulse-mid"/>
      <circle cx="45" cy="145" r="4.5" fill="#05070B" stroke="#00F5D4" stroke-width="1.6" class="pulse-slow"/>
      <circle cx="285" cy="45" r="5" fill="#05070B" stroke="#00F5D4" stroke-width="1.8" filter="url(#glow)" class="pulse-fast"/>
      <circle cx="25" cy="70" r="4" fill="#05070B" stroke="#A855F7" stroke-width="1.5" class="pulse-mid"/>
      <circle cx="85" cy="25" r="4" fill="#05070B" stroke="#38BDF8" stroke-width="1.5" class="pulse-slow"/>
      <circle cx="190" cy="30" r="4.5" fill="#05070B" stroke="#00F5D4" stroke-width="1.5" class="pulse-mid"/>
      <circle cx="270" cy="140" r="5" fill="#05070B" stroke="#A855F7" stroke-width="1.8" class="pulse-fast"/>
      <circle cx="95" cy="185" r="3.5" fill="#05070B" stroke="#38BDF8" stroke-width="1.3"/>
      <circle cx="250" cy="185" r="3.5" fill="#05070B" stroke="#A855F7" stroke-width="1.3"/>

      <!-- Subtle Neuro-Tech Node Labels -->
      <text x="132" y="69" class="mono" font-size="9.5" fill="#00F5D4" fill-opacity="0.8">RAG_CORE</text>
      <text x="226" y="92" class="mono" font-size="9.5" fill="#C084FC" fill-opacity="0.85">PM_STRAT</text>
      <text x="184" y="176" class="mono" font-size="9.5" fill="#38BDF8" fill-opacity="0.8">NEURO_AI</text>
    </g>

    <!-- Left Content Block -->
    <g transform="translate(38, 68)">
      <!-- Command line intro -->
      <text x="0" y="12" class="mono" font-size="13" fill="#00F5D4">$</text>
      <text x="16" y="12" class="mono" font-size="13" fill="#94A3B8">whoami --role="product &amp; program"</text>

      <!-- Main Name -->
      <text x="0" y="64" class="sans" font-size="44" font-weight="800" letter-spacing="1.5" fill="url(#neonText)">VERONIKA</text>

      <!-- Role Headline -->
      <text x="2" y="94" class="mono" font-size="15.5" font-weight="600" fill="#E2E8F0">
        Technical &amp; AI Product / Program Manager<tspan class="cursor" fill="#00F5D4">_</tspan>
      </text>

      <!-- Subline -->
      <text x="2" y="120" class="sans" font-size="13.5" fill="#94A3B8">
        Bridging Agentic AI, Healthcare Tech &amp; Cross-Functional Delivery
      </text>

      <!-- Status Pills -->
      <g transform="translate(0, 142)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="218" height="28" rx="6" fill="#0F172A" stroke="#00F5D4" stroke-opacity="0.45" stroke-width="1"/>
        <circle cx="15" cy="14" r="3.8" fill="#00F5D4" class="status-dot"/>
        <text x="27" y="18" class="mono" font-size="11.5" fill="#E2E8F0">M.Sc. Neuroscience (1.1)</text>

        <!-- Pill 2 -->
        <rect x="230" y="0" width="166" height="28" rx="6" fill="#0F172A" stroke="#A855F7" stroke-opacity="0.5" stroke-width="1"/>
        <text x="244" y="18" class="mono" font-size="11.5" fill="#D8B4FE">Berlin → Freiburg</text>
      </g>
    </g>
  </g>

  <!-- Outer Neon-Tinted Border -->
  <rect x="1" y="1" width="898" height="268" rx="14" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="268" rx="14" stroke="url(#neonText)" stroke-opacity="0.28" stroke-width="1"/>
</svg>
